services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.12"
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    restart: unless-stopped
    environment:
      SERVICE_FQDN_AGENTMEMORY_3111: ${SERVICE_FQDN_AGENTMEMORY_3111}
    expose:
      - "3111"
      - "3113"
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agentmemory-api.rule=Host(`agentmem.dhhcloud.io.vn`)"
      - "traefik.http.routers.agentmemory-api.entrypoints=http"
      - "traefik.http.routers.agentmemory-api.service=agentmemory-api-svc"
      - "traefik.http.services.agentmemory-api-svc.loadbalancer.server.port=3111"
      - "traefik.http.routers.agentmemory-ui.rule=Host(`agentmem-ui.dhhcloud.io.vn`)"
      - "traefik.http.routers.agentmemory-ui.entrypoints=http"
      - "traefik.http.routers.agentmemory-ui.service=agentmemory-ui-svc"
      - "traefik.http.services.agentmemory-ui-svc.loadbalancer.server.port=3113"
      - "traefik.http.routers.agentmemory-ui.middlewares=agentmemory-auth"
      - "traefik.http.middlewares.agentmemory-auth.basicauth.users=admin:$apr1$E1ltcGk.$mdsscE/CSxwEx2./aJu9t."

volumes:
  agentmemory-data:
