services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.12"
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    restart: unless-stopped
    environment:
      SERVICE_FQDN_AGENTMEMORY_3111: ${SERVICE_FQDN_AGENTMEMORY_3111}
    expose:
      - "3111"
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  viewer-proxy:
    image: alpine/socat
    restart: unless-stopped
    network_mode: "service:agentmemory"
    command:
    - sh
    - -lc
    - apk add --no-cache socat && exec socat TCP-LISTEN:3114,bind=0.0.0.0,fork,reuseaddr TCP:127.0.0.1:3113
    environment:
      - SERVICE_FQDN_VIEWER_3114=https://agentmem-ui.dhhcloud.io.vn
    labels:
      - traefik.http.middlewares.viewer-auth.basicauth.users=admin:$apr1$E1ltcGk.$mdsscE/CSxwEx2./aJu9t.
      - traefik.http.routers.viewer-proxy.middlewares=viewer-auth
volumes:
  agentmemory-data:
